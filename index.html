<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUR'IA — Configuration de votre agent vocal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B1E; --surface:#16262A; --surface-2:#1D3236; --line:#2A4247;
    --accent:#4FD1C5; --accent-dim:#2E7A72; --warm:#F2A65A;
    --text:#EAF2F1; --muted:#7FA6A3; --error:#E27D6A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;min-height:100vh;line-height:1.5;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px;}
  header.top{margin-bottom:28px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .brand .mark{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:22px;letter-spacing:0.02em;}
  .brand .mark span{color:var(--accent);}
  .brand .tag{font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}
  h1.title{font-family:'Space Grotesk', sans-serif;font-size:26px;font-weight:600;margin:14px 0 6px;letter-spacing:-0.01em;}
  p.sub{color:var(--muted);font-size:14.5px;margin:0;max-width:48ch;}
  .waveform{display:flex;align-items:flex-end;gap:3px;height:34px;margin:22px 0 6px;}
  .waveform .bar{flex:1;background:var(--surface-2);border-radius:2px;transition:background 0.4s ease, transform 0.4s ease;transform-origin:bottom;}
  .waveform .bar.done{background:var(--accent);}
  .waveform .bar.current{background:var(--warm);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.55;}}
  .step-label{display:flex;justify-content:space-between;font-family:'IBM Plex Mono', monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:26px;}
  .step-label b{color:var(--text);font-weight:500;}
  section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;}
  h2.section-title{font-family:'Space Grotesk', sans-serif;font-size:18px;font-weight:600;margin:0 0 4px;}
  p.section-desc{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  h3.sub-title{font-family:'Space Grotesk', sans-serif;font-size:14px;font-weight:600;margin:22px 0 10px;color:var(--accent);}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
  .field .hint{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px;}
  input[type=text], input[type=email], input[type=tel], textarea, select{
    width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:10px 12px;font-family:'IBM Plex Sans', sans-serif;font-size:14.5px;outline:none;transition:border-color 0.15s ease;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:64px;}
  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choice-grid.thirds{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:420px){.choice-grid.thirds{grid-template-columns:1fr 1fr;}}
  .choice{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;cursor:pointer;font-size:13.5px;text-align:center;transition:border-color 0.15s ease, background 0.15s ease;user-select:none;}
  .choice.selected{border-color:var(--accent);background:rgba(79,209,197,0.1);color:var(--accent);font-weight:600;}
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .check-row{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;}
  .check-row input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
  .day-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .day-row .day-name{width:64px;font-size:13px;color:var(--muted);flex-shrink:0;}
  .day-row input[type=text]{flex:1;}
  .day-row label.closed{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:400;}
  .repeat-block{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;position:relative;background:var(--bg);}
  .repeat-block .remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;}
  .add-btn{background:none;border:1px dashed var(--line);color:var(--accent);border-radius:8px;padding:10px;width:100%;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans', sans-serif;}
  .add-btn:hover{border-color:var(--accent);}
  .nav{display:flex;justify-content:space-between;margin-top:22px;gap:12px;}
  button.btn{font-family:'Space Grotesk', sans-serif;font-weight:600;font-size:14.5px;padding:12px 22px;border-radius:9px;border:none;cursor:pointer;transition:transform 0.1s ease, opacity 0.15s ease;}
  button.btn:active{transform:scale(0.97);}
  button.btn-primary{background:var(--accent);color:#08211F;margin-left:auto;}
  button.btn-primary:hover{opacity:0.9;}
  button.btn-ghost{background:none;color:var(--muted);border:1px solid var(--line);}
  button.btn-ghost:hover{color:var(--text);}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}
  .conditional{border-left:2px solid var(--accent-dim);padding-left:14px;margin:18px 0;}
  .success{text-align:center;padding:40px 10px;}
  .success .icon{width:56px;height:56px;border-radius:50%;background:rgba(79,209,197,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .success h2{font-family:'Space Grotesk';font-size:20px;margin:0 0 8px;}
  .success p{color:var(--muted);font-size:14px;}
  #jsonOut{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:11.5px;max-height:220px;overflow:auto;margin-top:18px;white-space:pre-wrap;word-break:break-word;}
  .consent-row{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:6px;}
  .consent-row input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
  .consent-row span{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark">EUR<span>'</span>IA</span>
      <span class="tag">Onboarding agent vocal</span>
    </div>
    <h1 class="title">Configurons votre agent vocal</h1>
    <p class="sub">Ces informations servent à paramétrer précisément votre agent. Comptez 10 à 15 minutes.</p>
  </header>
  <div class="waveform" id="waveform"></div>
  <div class="step-label">
    <span>Étape <b id="stepNum">1</b> / <span id="stepTotal">11</span></span>
    <span id="stepName">Identité</span>
  </div>
  <form id="form"></form>
  <div class="nav" id="navBar">
    <button type="button" class="btn btn-ghost" id="prevBtn">Retour</button>
    <button type="button" class="btn btn-primary" id="nextBtn">Continuer</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — à modifier par Jordan avant déploiement
   ============================================================ */
const N8N_WEBHOOK_URL = ""; // ex: https://n8n.srv1478304.hstgr.cloud/webhook-test/22b84f2a-f648-4d3c-b866-8c6b9d62e726

/* ============================================================
   STATE
   ============================================================ */
const state = {
  entreprise: { nom:"", secteur:"", secteurAutre:"", siret:"", adresse:"", zone:"", siteWeb:"",
                refNom:"", refEmail:"", refTel:"" },
  objectif: { roles:[], roleAutre:"", description:"", scenarios:[], scenarioAutre:"",
              infosConnues:[], infosConnuesAutre:"" },
  horaires: { jours: { Lun:"", Mar:"", Mer:"", Jeu:"", Ven:"", Sam:"", Dim:"" },
              fermes: [], hoursUrgenceOuiNon:"", hoursUrgence:"" },
  services: [ { nom:"", description:"", duree:"" } ],
  communiquerTarifs: "",
  paiement: { acompte:"", montantAcompte:"", outilPaiement:"", outilPaiementAutre:"",
              lienPaiement:"", moyensPaiement:[], moyensPaiementAutre:"" },
  agent: { types:[], ton:"", genre:"", vouvoiement:"", langues:[], langueAutre:"", bascule:"",
           nomAgent:"", accueil:"", finAppel:"", restrictions:"",
           urgenceDetect:"", urgenceLesquelles:"", urgenceAction:[], urgenceActionAutre:"",
           transfertCas:[], transfertCasAutre:"", transfertContact:"",
           transfertSiPersonne:[], transfertSiPersonneAutre:"" },
  diana: { calendrier:"", calendrierDetail:"", typesRdv:"", dureeDefaut:"", nbPlannings:"",
           ressources:[""], infosAvant:[], infosAvantAutre:"",
           delaiAnnulation:"", delaiModification:"", proposerAlternatif:"" },
  marie: { objectif:"", sourceContacts:"", pitch:"", objections:[{ objection:"", reponse:"" }],
           creneauxAppel:"", frequenceRappel:"" },
  faq: [ { question:"", reponse:"" } ],
  technique: { numeroExistant:"", numero:"", usageNumero:"", sensAppels:"",
               calcomEmail:"", contactTech:"", outils:[], outilsAutre:"",
               donneesDestination:[], donneesDestinationAutre:"" },
  validation: { responsableNom:"", numeroTest:"", emailTest:"", scenariosTest:[""],
                confirmNom:"", confirmFonction:"", confirmDate:"", confirmAccepte:false }
};

/* ============================================================
   STEP DEFINITIONS
   ============================================================ */
function getSteps(){
  const steps = [
    { name:"Identité", render: renderIdentite },
    { name:"Mission", render: renderObjectif },
    { name:"Horaires", render: renderHoraires },
    { name:"Services", render: renderServices },
    { name:"Paiement", render: renderPaiement },
    { name:"Agent", render: renderAgent }
  ];
  if (state.agent.types.includes("diana")) steps.push({ name:"Diana · Accueil", render: renderDiana });
  if (state.agent.types.includes("marie")) steps.push({ name:"Marie · Prospection", render: renderMarie });
  steps.push({ name:"FAQ", render: renderFaq });
  steps.push({ name:"Intégrations", render: renderTechnique });
  steps.push({ name:"Validation", render: renderValidation });
  return steps;
}

let current = 0;

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function renderWaveform(){
  const steps = getSteps();
  const wf = document.getElementById('waveform');
  wf.innerHTML = "";
  const heights = [40,65,45,80,55,70,42,60,48,75,50,58,72];
  steps.forEach((s,i)=>{
    const bar = document.createElement('div');
    bar.className = 'bar' + (i < current ? ' done' : i === current ? ' current' : '');
    bar.style.height = (heights[i % heights.length]) + '%';
    wf.appendChild(bar);
  });
  document.getElementById('stepNum').textContent = current + 1;
  document.getElementById('stepTotal').textContent = steps.length;
  document.getElementById('stepName').textContent = steps[current].name;
}

/* ============================================================
   FIELD HELPERS
   ============================================================ */
function fieldText(label, value, onInput, hint, type="text"){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
  if (type !== 'textarea') input.type = type;
  input.value = value || "";
  input.addEventListener('input', e => onInput(e.target.value));
  wrap.appendChild(input);
  return wrap;
}

function fieldChoices(label, options, selected, multi, onChange, hint){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const grid = el(`<div class="choice-grid ${options.length>2?'thirds':''}"></div>`);
  options.forEach(opt=>{
    const isSel = multi ? selected.includes(opt.value) : selected === opt.value;
    const chip = el(`<div class="choice ${isSel?'selected':''}">${opt.label}</div>`);
    chip.addEventListener('click', ()=>{
      if (multi){
        const idx = selected.indexOf(opt.value);
        if (idx > -1) selected.splice(idx,1); else selected.push(opt.value);
      } else { onChange(opt.value, selected); }
      renderStep();
    });
    grid.appendChild(chip);
  });
  wrap.appendChild(grid);
  return wrap;
}

// Stacked checklist for longer multi-select lists. Pass revealValue (e.g. "autre")
// to force a re-render when that specific option is toggled (to show/hide a follow-up field).
function fieldChecklist(label, options, selected, hint, revealValue){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const list = el(`<div class="checklist"></div>`);
  options.forEach(opt=>{
    const checked = selected.includes(opt.value);
    const row = el(`<label class="check-row"><input type="checkbox" ${checked?'checked':''}/> <span>${opt.label}</span></label>`);
    row.querySelector('input').addEventListener('change', e=>{
      if (e.target.checked){ if(!selected.includes(opt.value)) selected.push(opt.value); }
      else { const idx = selected.indexOf(opt.value); if (idx > -1) selected.splice(idx,1); }
      if (revealValue && opt.value === revealValue) renderStep();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function repeatingTextList(items, addLabel, placeholder){
  const wrap = document.createElement('div');
  items.forEach((val,i)=>{
    const row = el(`<div class="day-row"></div>`);
    const input = document.createElement('input');
    input.type='text'; input.placeholder = placeholder || "";
    input.value = val;
    input.addEventListener('input', e=> items[i] = e.target.value);
    row.appendChild(input);
    if (items.length>1){
      const rm = el(`<button type="button" class="remove" style="position:static;">✕</button>`);
      rm.addEventListener('click', ()=>{ items.splice(i,1); renderStep(); });
      row.appendChild(rm);
    }
    wrap.appendChild(row);
  });
  const addBtn = el(`<button type="button" class="add-btn">+ ${addLabel}</button>`);
  addBtn.addEventListener('click', ()=>{ items.push(""); renderStep(); });
  wrap.appendChild(addBtn);
  return wrap;
}

/* ============================================================
   STEP 1 — IDENTITÉ
   ============================================================ */
function renderIdentite(container){
  const s = state.entreprise;
  container.appendChild(el(`<h2 class="section-title">Identité de l'entreprise</h2>
    <p class="section-desc">Ces informations permettent à l'agent de se présenter correctement à vos appelants.</p>`));
  container.appendChild(fieldText("Nom de l'entreprise", s.nom, v=>s.nom=v));
  container.appendChild(fieldChoices("Secteur d'activité", [
    {value:"btp",label:"BTP / Construction"},
    {value:"coiffure",label:"Coiffure"},
    {value:"esthetique",label:"Esthétique"},
    {value:"sante",label:"Santé / médical"},
    {value:"veterinaire",label:"Vétérinaire"},
    {value:"kine",label:"Kinésithérapie"},
    {value:"immobilier",label:"Immobilier"},
    {value:"commerce",label:"Commerce"},
    {value:"artisanat",label:"Artisanat"},
    {value:"autre",label:"Autre"}
  ], s.secteur, false, v=>s.secteur=v));
  if (s.secteur === "autre"){
    container.appendChild(fieldText("Précisez le secteur", s.secteurAutre, v=>s.secteurAutre=v));
  }
  container.appendChild(fieldText("SIRET", s.siret, v=>s.siret=v, "Facultatif"));
  container.appendChild(fieldText("Adresse de l'établissement", s.adresse, v=>s.adresse=v));
  container.appendChild(fieldText("Zone d'intervention géographique", s.zone, v=>s.zone=v, "Ex : Guadeloupe entière, communes du sud uniquement…"));
  container.appendChild(fieldText("Site internet / réseaux sociaux", s.siteWeb, v=>s.siteWeb=v, "Facultatif"));
  container.appendChild(el(`<h3 class="sub-title">Contact référent</h3>`));
  container.appendChild(fieldText("Nom du responsable", s.refNom, v=>s.refNom=v));
  container.appendChild(fieldText("Email", s.refEmail, v=>s.refEmail=v, "", "email"));
  container.appendChild(fieldText("Téléphone", s.refTel, v=>s.refTel=v, "", "tel"));
}

/* ============================================================
   STEP 2 — MISSION / OBJECTIF DE L'AGENT
   ============================================================ */
function renderObjectif(container){
  const o = state.objectif;
  container.appendChild(el(`<h2 class="section-title">Mission de l'agent</h2>
    <p class="section-desc">À quoi doit servir votre agent vocal, et dans quelles situations.</p>`));
  container.appendChild(fieldChecklist("Rôle principal souhaité", [
    {value:"repondre",label:"Répondre aux appels entrants"},
    {value:"prendre_rdv",label:"Prendre des rendez-vous"},
    {value:"modifier_rdv",label:"Modifier ou annuler des rendez-vous"},
    {value:"infos",label:"Donner des informations aux clients"},
    {value:"qualifier",label:"Qualifier les demandes avant rappel humain"},
    {value:"urgences",label:"Gérer les urgences"},
    {value:"transferer",label:"Transférer certains appels"},
    {value:"relancer",label:"Relancer des clients"},
    {value:"autre",label:"Autre"}
  ], o.roles, "", "autre"));
  if (o.roles.includes("autre")){
    container.appendChild(fieldText("Précisez le rôle", o.roleAutre, v=>o.roleAutre=v));
  }
  container.appendChild(fieldText("Décrivez en quelques phrases ce que vous attendez de l'agent", o.description, v=>o.description=v, "", "textarea"));
  container.appendChild(el(`<h3 class="sub-title">Scénarios d'appels à prévoir</h3>`));
  container.appendChild(fieldChecklist("Cochez les situations que l'agent doit gérer", [
    {value:"nouveau_client",label:"Nouveau client souhaitant un RDV"},
    {value:"modif_client",label:"Client existant souhaitant modifier un RDV"},
    {value:"annulation",label:"Client souhaitant annuler"},
    {value:"tarifs",label:"Client demandant les tarifs"},
    {value:"horaires",label:"Client demandant les horaires"},
    {value:"mecontent",label:"Client mécontent"},
    {value:"devis",label:"Client demandant un devis"},
    {value:"urgence",label:"Urgence"},
    {value:"hors_horaires",label:"Appel hors horaires d'ouverture"},
    {value:"sans_reponse",label:"Appel sans réponse humaine disponible"},
    {value:"autre",label:"Autre"}
  ], o.scenarios, "", "autre"));
  if (o.scenarios.includes("autre")){
    container.appendChild(fieldText("Précisez le scénario", o.scenarioAutre, v=>o.scenarioAutre=v));
  }
  container.appendChild(el(`<h3 class="sub-title">Informations que l'agent doit connaître</h3>`));
  container.appendChild(fieldChecklist("Quels renseignements doit-il pouvoir donner ?", [
    {value:"adresse",label:"Adresse de l'entreprise"},
    {value:"horaires",label:"Horaires d'ouverture"},
    {value:"tarifs",label:"Tarifs"},
    {value:"services",label:"Services proposés"},
    {value:"disponibilites",label:"Disponibilités"},
    {value:"paiement",label:"Moyens de paiement"},
    {value:"annulation",label:"Conditions d'annulation"},
    {value:"reservation",label:"Modalités de réservation"},
    {value:"parking",label:"Parking / accès"},
    {value:"urgence",label:"Informations d'urgence"},
    {value:"autre",label:"Autre"}
  ], o.infosConnues, "", "autre"));
  if (o.infosConnues.includes("autre")){
    container.appendChild(fieldText("Précisez", o.infosConnuesAutre, v=>o.infosConnuesAutre=v));
  }
}

/* ============================================================
   STEP 3 — HORAIRES
   ============================================================ */
function renderHoraires(container){
  const h = state.horaires;
  container.appendChild(el(`<h2 class="section-title">Horaires d'ouverture</h2>
    <p class="section-desc">L'agent s'appuie dessus pour proposer des créneaux et gérer les appels hors horaires.</p>`));
  Object.keys(h.jours).forEach(jour=>{
    const closed = h.fermes.includes(jour);
    const row = el(`<div class="day-row"><span class="day-name">${jour}</span></div>`);
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = closed ? "Fermé" : "ex : 8h-12h, 14h-17h";
    input.value = h.jours[jour];
    input.disabled = closed;
    input.addEventListener('input', e=> h.jours[jour] = e.target.value);
    row.appendChild(input);
    const lbl = el(`<label class="closed"><input type="checkbox" ${closed?'checked':''}/> Fermé</label>`);
    lbl.querySelector('input').addEventListener('change', e=>{
      if (e.target.checked){ if(!h.fermes.includes(jour)) h.fermes.push(jour); }
      else { h.fermes = h.fermes.filter(d=>d!==jour); }
      renderStep();
    });
    row.appendChild(lbl);
    container.appendChild(row);
  });
  container.appendChild(fieldChoices("L'agent doit-il répondre en dehors des horaires d'ouverture ?", [
    {value:"oui",label:"Oui"}, {value:"non",label:"Non"}
  ], h.hoursUrgenceOuiNon || "", false, v=>h.hoursUrgenceOuiNon=v));
  container.appendChild(fieldText("Que doit-il dire ou faire en dehors des horaires ?", h.hoursUrgence, v=>h.hoursUrgence=v, "Ex : proposer un rappel le jour ouvré suivant, transférer les urgences au 06…", "textarea"));
}

/* ============================================================
   STEP 4 — SERVICES
   ============================================================ */
function renderServices(container){
  container.appendChild(el(`<h2 class="section-title">Services proposés</h2>
    <p class="section-desc">L'agent doit connaître ce que vous proposez pour orienter et qualifier correctement.</p>`));
  state.services.forEach((svc, i)=>{
    const block = el(`<div class="repeat-block">
      ${state.services.length>1?'<button type="button" class="remove">✕ retirer</button>':''}
    </div>`);
    block.appendChild(fieldText("Nom du service", svc.nom, v=>svc.nom=v));
    block.appendChild(fieldText("Description courte", svc.description, v=>svc.description=v, "", "textarea"));
    block.appendChild(fieldText("Durée moyenne", svc.duree, v=>svc.duree=v, "Ex : 45 min"));
    const rm = block.querySelector('.remove');
    if (rm) rm.addEventListener('click', ()=>{ state.services.splice(i,1); renderStep(); });
    container.appendChild(block);
  });
  const addBtn = el(`<button type="button" class="add-btn">+ Ajouter un service</button>`);
  addBtn.addEventListener('click', ()=>{ state.services.push({nom:"",description:"",duree:""}); renderStep(); });
  container.appendChild(addBtn);
  container.appendChild(fieldChoices("Faut-il communiquer les tarifs au téléphone ?", [
    {value:"oui",label:"Oui"}, {value:"non",label:"Non, orienter vers un devis"}
  ], state.communiquerTarifs, false, v=>state.communiquerTarifs=v));
}

/* ============================================================
   STEP 5 — PAIEMENT & ACOMPTE
   ============================================================ */
function renderPaiement(container){
  const p = state.paiement;

/* ============================================================
   MAIN RENDER + NAV
   ============================================================ */
function renderStep(){
  const steps = getSteps();
  if (current > steps.length - 1) current = steps.length - 1;
  renderWaveform();
  const form = document.getElementById('form');
  form.innerHTML = "";
  const card = document.createElement('section');
  card.className = 'card';
  steps[current].render(card);
  form.appendChild(card);
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === steps.length - 1 ? "Envoyer" : "Continuer";
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if (current > 0){ current--; renderStep(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const steps = getSteps();
  if (current === steps.length - 1){
    submitForm();
  } else {
    current++; renderStep();
  }
});

/* ============================================================
   SUBMIT
   ============================================================ */
async function submitForm(){
  const payload = JSON.parse(JSON.stringify(state));
  payload._meta = { source:"euria-onboarding", envoye_le: new Date().toISOString() };

  if (N8N_WEBHOOK_URL){
    document.getElementById('nextBtn').textContent = "Envoi…";
    document.getElementById('nextBtn').disabled = true;
    try{
      const res = await fetch(N8N_WEBHOOK_URL, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Réponse serveur invalide");
      showSuccess(payload, true);
    } catch(err){
      showSuccess(payload, false, err.message);
    }
  } else {
    showSuccess(payload, null);
  }
}

function showSuccess(payload, sent, errMsg){
  document.getElementById('waveform').style.display='none';
  document.querySelector('.step-label').style.display='none';
  document.getElementById('navBar').style.display='none';
  const form = document.getElementById('form');
  let statusHtml;
  if (sent === true){
    statusHtml = `<h2>Informations envoyées</h2><p>Merci, votre agent va être configuré avec ces éléments. Nous revenons vers vous rapidement.</p>`;
  } else if (sent === false){
    statusHtml = `<h2>Envoi impossible</h2><p>Une erreur réseau est survenue (${errMsg||''}). Copiez le récapitulatif ci-dessous et transmettez-le nous par email.</p>`;
  } else {
    statusHtml = `<h2>Récapitulatif prêt</h2><p>Le webhook n'est pas encore configuré. Copiez ce récapitulatif et transmettez-le à votre agence.</p>`;
  }
  form.innerHTML = `<section class="card success">
    <div class="icon">✓</div>
    ${statusHtml}
    <pre id="jsonOut" class="mono"></pre>
    <button type="button" class="add-btn" id="copyBtn" style="margin-top:12px;">Copier le récapitulatif</button>
  </section>`;
  document.getElementById('jsonOut').textContent = JSON.stringify(payload, null, 2);
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    document.getElementById('copyBtn').textContent = "Copié ✓";
  });
}

renderStep();
