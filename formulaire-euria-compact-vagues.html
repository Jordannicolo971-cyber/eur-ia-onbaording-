<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUR'IA — Configuration de votre agent vocal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7faff; --surface:#fff; --surface-2:#f0f6ff; --line:#dfe9f8;
  --navy:#071b49; --navy2:#0b2d6d; --accent:#1767ff; --accent-2:#6fb1ff;
  --accent-dim:#cfe0ff; --text:#10244b; --muted:#587097; --error:#d14343;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--text);font-family:'Inter','IBM Plex Sans',sans-serif;line-height:1.55;
  background:
    radial-gradient(circle at 92% 4%,rgba(23,103,255,.13),transparent 25%),
    radial-gradient(circle at 5% 92%,rgba(111,177,255,.14),transparent 28%),
    linear-gradient(180deg,#fff 0%,#f7faff 100%);
  background-attachment:fixed;
}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:760px;margin:0 auto;padding:34px 24px 86px;position:relative}
header.top{
  position:relative;margin-bottom:28px;padding:26px 28px 32px;
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 26px 65px -48px rgba(7,27,73,.45);overflow:hidden;
}
header.top::before{
  content:"";position:absolute;right:-18px;top:-15px;width:230px;height:150px;opacity:.42;
  background-image:radial-gradient(circle,rgba(23,103,255,.48) 1.4px,transparent 1.6px);
  background-size:17px 17px;
  -webkit-mask-image:linear-gradient(135deg,#000 0%,transparent 75%);
  mask-image:linear-gradient(135deg,#000 0%,transparent 75%);
}
header.top::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(90deg,var(--navy2),var(--accent),var(--accent-2));
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:17px;position:relative;z-index:1}
.brand-logo{
  width:48px;height:48px;border-radius:13px;object-fit:cover;
  box-shadow:0 8px 24px rgba(23,103,255,.16);
}
.brand-copy{display:flex;flex-direction:column;gap:1px}
.brand .mark{
  font-family:'Poppins','Space Grotesk',sans-serif;font-weight:800;font-size:23px;
  letter-spacing:-.035em;color:var(--navy);line-height:1;
}
.brand .mark span{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .tag{
  font-family:'Inter',sans-serif;font-size:10px;color:var(--accent);font-weight:800;
  text-transform:uppercase;letter-spacing:.12em;
}
h1.title{
  position:relative;z-index:1;font-family:'Poppins','Space Grotesk',sans-serif;
  font-size:clamp(1.85rem,5vw,2.65rem);font-weight:700;line-height:1.08;
  letter-spacing:-.04em;color:var(--navy);margin:0 0 10px;max-width:590px;
}
p.sub{position:relative;z-index:1;color:var(--muted);font-size:14.5px;margin:0;max-width:57ch;line-height:1.65}
.waveform{display:flex;align-items:flex-end;gap:5px;height:28px;margin:26px 6px 8px}
.waveform .bar{flex:1;background:#dce8f9;border-radius:999px;transition:.3s;transform-origin:bottom}
.waveform .bar.done{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.waveform .bar.current{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scaleY(1)}50%{opacity:.55;transform:scaleY(.72)}}
.step-label{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin:0 6px 22px;
}
.step-label b{color:var(--accent);font-weight:800}
section.card{
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;
  padding:30px 28px;box-shadow:0 24px 60px -44px rgba(7,27,73,.45);
}
h2.section-title{
  font-family:'Poppins','Space Grotesk',sans-serif;font-size:21px;font-weight:700;
  letter-spacing:-.025em;margin:0 0 5px;color:var(--navy);
}
p.section-desc{color:var(--muted);font-size:13.5px;margin:0 0 25px;line-height:1.6}
h3.sub-title{
  font-family:'Poppins','Space Grotesk',sans-serif;font-size:14px;font-weight:700;
  margin:26px 0 11px;color:var(--accent);
}
.field{margin-bottom:19px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:var(--navy)}
.field .hint{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:3px;line-height:1.45}
input[type=text],input[type=email],input[type=tel],textarea,select{
  width:100%;background:#fbfdff;border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:12px 13px;font-family:'Inter','IBM Plex Sans',sans-serif;
  font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,textarea:focus,select:focus{
  background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(23,103,255,.08)
}
textarea{resize:vertical;min-height:78px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-grid.thirds{grid-template-columns:repeat(3,1fr)}
.choice{
  border:1px solid var(--line);background:#fbfdff;border-radius:12px;padding:12px 10px;
  cursor:pointer;font-size:13px;text-align:center;transition:.16s;user-select:none;
}
.choice:hover{border-color:#a9c7f8;background:#f5f9ff}
.choice.selected{
  border-color:var(--accent);background:linear-gradient(135deg,rgba(23,103,255,.10),rgba(111,177,255,.08));
  color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px rgba(23,103,255,.06);
}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-row{
  display:flex;align-items:center;gap:10px;font-size:13.5px;padding:11px 12px;
  border:1px solid var(--line);border-radius:11px;background:#fbfdff;cursor:pointer;
}
.check-row:hover{border-color:#b8cff4}
.check-row input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.day-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.day-row .day-name{width:64px;font-size:13px;color:var(--muted);flex-shrink:0;font-weight:600}
.day-row input[type=text]{flex:1}
.day-row label.closed{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;font-weight:400}
.repeat-block{
  border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:12px;
  position:relative;background:#f8fbff;
}
.repeat-block .remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.add-btn{
  background:#fff;border:1px dashed #9dbdf1;color:var(--accent);border-radius:11px;
  padding:11px;width:100%;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif
}
.add-btn:hover{background:#f5f9ff;border-color:var(--accent)}
.nav{display:flex;justify-content:space-between;margin-top:20px;gap:12px}
button.btn{
  font-family:'Poppins','Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
  padding:12px 22px;border-radius:11px;border:none;cursor:pointer;transition:.15s
}
button.btn:active{transform:scale(.98)}
button.btn-primary{
  background:linear-gradient(135deg,var(--navy2),var(--accent));color:#fff;margin-left:auto;
  box-shadow:0 10px 24px -12px rgba(23,103,255,.8)
}
button.btn-primary:hover{transform:translateY(-1px)}
button.btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--line)}
button.btn-ghost:hover{color:var(--navy);border-color:#b8cff4}
button.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.conditional{border-left:3px solid var(--accent-dim);padding-left:15px;margin:18px 0}
.success{text-align:center;padding:46px 18px!important}
.success .icon{
  width:60px;height:60px;border-radius:50%;background:rgba(23,103,255,.10);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  color:var(--accent);font-weight:800;font-size:20px
}
.success h2{font-family:'Poppins';font-size:21px;margin:0 0 8px;color:var(--navy)}
.success p{color:var(--muted);font-size:14px}
#jsonOut{
  text-align:left;background:#f7faff;border:1px solid var(--line);border-radius:12px;
  padding:14px;font-size:11.5px;max-height:220px;overflow:auto;margin-top:18px;
  white-space:pre-wrap;word-break:break-word
}
.consent-row{
  display:flex;align-items:flex-start;gap:10px;background:#f7faff;border:1px solid var(--line);
  border-radius:12px;padding:15px;margin-top:6px
}
.consent-row input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.consent-row span{font-size:13px;color:var(--muted)}
.form-footer{text-align:center;margin-top:30px;color:#7890b2;font-size:11.5px}
.form-footer strong{color:var(--navy)}
@media(max-width:600px){
  .wrap{padding:18px 15px 60px}
  header.top{padding:22px 20px 28px;border-radius:19px}
  .brand-logo{width:42px;height:42px}
  section.card{padding:24px 18px;border-radius:18px}
  .choice-grid,.choice-grid.thirds{grid-template-columns:1fr 1fr}
  .day-row{flex-wrap:wrap}.day-row .day-name{width:100%}
}
@media(max-width:390px){.choice-grid,.choice-grid.thirds{grid-template-columns:1fr}}
</style>

button.btn{padding:11px 20px!important;border-radius:9px!important;font-size:14px!important}

  .wrap{padding:18px 14px 55px!important}

<style>
/* Vagues EUR'IA comme sur le site */
body::before,
body::after{
  content:"";
  position:fixed;
  left:0;
  width:100%;
  height:170px;
  pointer-events:none;
  z-index:-1;
  opacity:.95;
}
body::before{
  top:0;
  background:
    radial-gradient(80% 90px at 20% 0%, rgba(23,103,255,.12), transparent 72%),
    radial-gradient(72% 100px at 82% 4%, rgba(111,177,255,.18), transparent 74%);
}
body::after{
  bottom:-36px;
  background:
    radial-gradient(65% 92px at 18% 100%, rgba(111,177,255,.20), transparent 72%),
    radial-gradient(82% 100px at 84% 100%, rgba(23,103,255,.12), transparent 74%);
}

.wave-band{
  position:absolute;
  left:0;
  right:0;
  height:44px;
  pointer-events:none;
  overflow:hidden;
}
.wave-band.top{top:0}
.wave-band.bottom{bottom:0;transform:rotate(180deg)}
.wave-band svg{
  width:100%;
  height:100%;
  display:block;
}
.wave-band path:first-child{fill:rgba(23,103,255,.10)}
.wave-band path:last-child{fill:rgba(111,177,255,.16)}
header.top{
  overflow:hidden!important;
}
header.top .header-wave{
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:42px;
  pointer-events:none;
  opacity:.9;
}
header.top .header-wave svg{width:100%;height:100%;display:block}
header.top .header-wave .w1{fill:rgba(23,103,255,.10)}
header.top .header-wave .w2{fill:rgba(111,177,255,.16)}
.form-wave-divider{
  height:34px;
  margin:18px 0 8px;
  overflow:hidden;
  pointer-events:none;
}
.form-wave-divider svg{width:100%;height:100%;display:block}
.form-wave-divider .w1{fill:rgba(23,103,255,.10)}
.form-wave-divider .w2{fill:rgba(111,177,255,.18)}
</style>

</head>

/* ============================================================
   STEP DEFINITIONS
   ============================================================ */
function getSteps(){
  const steps = [
    { name:"Identité", render: renderIdentite },
    { name:"Mission", render: renderObjectif },
    { name:"Horaires", render: renderHoraires },
    { name:"Services", render: renderServices },
    { name:"Paiement", render: renderPaiement },
    { name:"Agent", render: renderAgent }
  ];
  if (state.agent.types.includes("diana")) steps.push({ name:"Diana · Accueil", render: renderDiana });
  steps.push({ name:"FAQ", render: renderFaq });
  steps.push({ name:"Intégrations", render: renderTechnique });
  steps.push({ name:"Validation", render: renderValidation });
  return steps;
}

let current = 0;

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function renderWaveform(){
  const steps = getSteps();
  const wf = document.getElementById('waveform');
  wf.innerHTML = "";
  const heights = [40,65,45,80,55,70,42,60,48,75,50,58,72];
  steps.forEach((s,i)=>{
    const bar = document.createElement('div');
    bar.className = 'bar' + (i < current ? ' done' : i === current ? ' current' : '');
    bar.style.height = (heights[i % heights.length]) + '%';
    wf.appendChild(bar);
  });
  document.getElementById('stepNum').textContent = current + 1;
  document.getElementById('stepTotal').textContent = steps.length;
  document.getElementById('stepName').textContent = steps[current].name;
}

/* ============================================================
   FIELD HELPERS
   ============================================================ */
function fieldText(label, value, onInput, hint, type="text"){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const input = document.createElement(type === 'textarea' ? 'textarea' : 'input');
  if (type !== 'textarea') input.type = type;
  input.value = value || "";
  input.addEventListener('input', e => onInput(e.target.value));
  wrap.appendChild(input);
  return wrap;
}

function fieldChoices(label, options, selected, multi, onChange, hint){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const grid = el(`<div class="choice-grid ${options.length>2?'thirds':''}"></div>`);
  options.forEach(opt=>{
    const isSel = multi ? selected.includes(opt.value) : selected === opt.value;
    const chip = el(`<div class="choice ${isSel?'selected':''}">${opt.label}</div>`);
    chip.addEventListener('click', ()=>{
      if (multi){
        const idx = selected.indexOf(opt.value);
        if (idx > -1) selected.splice(idx,1); else selected.push(opt.value);
      } else { onChange(opt.value, selected); }
      renderStep();
    });
    grid.appendChild(chip);
  });
  wrap.appendChild(grid);
  return wrap;
}

// Stacked checklist for longer multi-select lists. Pass revealValue (e.g. "autre")
// to force a re-render when that specific option is toggled (to show/hide a follow-up field).
function fieldChecklist(label, options, selected, hint, revealValue){
  const wrap = el(`<div class="field"><label>${label}${hint? `<span class="hint">${hint}</span>`:""}</label></div>`);
  const list = el(`<div class="checklist"></div>`);
  options.forEach(opt=>{
    const checked = selected.includes(opt.value);
    const row = el(`<label class="check-row"><input type="checkbox" ${checked?'checked':''}/> <span>${opt.label}</span></label>`);
    row.querySelector('input').addEventListener('change', e=>{
      if (e.target.checked){ if(!selected.includes(opt.value)) selected.push(opt.value); }
      else { const idx = selected.indexOf(opt.value); if (idx > -1) selected.splice(idx,1); }
      if (revealValue && opt.value === revealValue) renderStep();
    });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function repeatingTextList(items, addLabel, placeholder){
  const wrap = document.createElement('div');
  items.forEach((val,i)=>{
    const row = el(`<div class="day-row"></div>`);
    const input = document.createElement('input');
    input.type='text'; input.placeholder = placeholder || "";
    input.value = val;
    input.addEventListener('input', e=> items[i] = e.target.value);
    row.appendChild(input);
    if (items.length>1){
      const rm = el(`<button type="button" class="remove" style="position:static;">✕</button>`);
      rm.addEventListener('click', ()=>{ items.splice(i,1); renderStep(); });
      row.appendChild(rm);
    }
    wrap.appendChild(row);
  });
  const addBtn = el(`<button type="button" class="add-btn">+ ${addLabel}</button>`);
  addBtn.addEventListener('click', ()=>{ items.push(""); renderStep(); });
  wrap.appendChild(addBtn);
  return wrap;
}

  container.appendChild(fieldText("SIRET", s.siret, v=>s.siret=v, "Facultatif"));

   ============================================================ */
function renderHoraires(container){
  const h = state.horaires;
  container.appendChild(el(`<h2 class="section-title">Horaires d'ouverture</h2>
    <p class="section-desc">L'agent s'appuie dessus pour proposer des créneaux et gérer les appels hors horaires.</p>`));
  Object.keys(h.jours).forEach(jour=>{
    const closed = h.fermes.includes(jour);
    const row = el(`<div class="day-row"><span class="day-name">${jour}</span></div>`);
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = closed ? "Fermé" : "ex : 8h-12h, 14h-17h";
    input.value = h.jours[jour];
    input.disabled = closed;
    input.addEventListener('input', e=> h.jours[jour] = e.target.value);
    row.appendChild(input);
    const lbl = el(`<label class="closed"><input type="checkbox" ${closed?'checked':''}/> Fermé</label>`);
    lbl.querySelector('input').addEventListener('change', e=>{
      if (e.target.checked){ if(!h.fermes.includes(jour)) h.fermes.push(jour); }
      else { h.fermes = h.fermes.filter(d=>d!==jour); }
      renderStep();
    });
    row.appendChild(lbl);
    container.appendChild(row);
  });
  container.appendChild(fieldChoices("L'agent doit-il répondre en dehors des horaires d'ouverture ?", [
    {value:"oui",label:"Oui"}, {value:"non",label:"Non"}
  ], h.hoursUrgenceOuiNon || "", false, v=>h.hoursUrgenceOuiNon=v));
  container.appendChild(fieldText("Que doit-il dire ou faire en dehors des horaires ?", h.hoursUrgence, v=>h.hoursUrgence=v, "Ex : proposer un rappel le jour ouvré suivant, transférer les urgences au 06…", "textarea"));
}

/* ============================================================
   MAIN RENDER + NAV
   ============================================================ */
function renderStep(){
  const steps = getSteps();
  if (current > steps.length - 1) current = steps.length - 1;
  renderWaveform();
  const form = document.getElementById('form');
  form.innerHTML = "";
  const card = document.createElement('section');
  card.className = 'card';
  steps[current].render(card);
  form.appendChild(card);
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').textContent = current === steps.length - 1 ? "Envoyer" : "Continuer";
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if (current > 0){ current--; renderStep(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const steps = getSteps();
  if (current === steps.length - 1){
    submitForm();
  } else {
    current++; renderStep();
  }
});

/* ============================================================
   SUBMIT
   ============================================================ */
async function submitForm(){
  const payload = JSON.parse(JSON.stringify(state));
  payload._meta = { source:"euria-onboarding", envoye_le: new Date().toISOString() };

  if (N8N_WEBHOOK_URL){
    document.getElementById('nextBtn').textContent = "Envoi…";
    document.getElementById('nextBtn').disabled = true;
    try{
      const res = await fetch(N8N_WEBHOOK_URL, {
        method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Réponse serveur invalide");
      showSuccess(payload, true);
    } catch(err){
      showSuccess(payload, false, err.message);
    }
  } else {
    showSuccess(payload, null);
  }
}

function showSuccess(payload, sent, errMsg){
  document.getElementById('waveform').style.display='none';
  document.querySelector('.step-label').style.display='none';
  document.getElementById('navBar').style.display='none';
  const form = document.getElementById('form');
  let statusHtml;
  if (sent === true){
    statusHtml = `<h2>Informations envoyées</h2><p>Merci, votre agent va être configuré avec ces éléments. Nous revenons vers vous rapidement.</p>`;
  } else if (sent === false){
    statusHtml = `<h2>Envoi impossible</h2><p>Une erreur réseau est survenue (${errMsg||''}). Copiez le récapitulatif ci-dessous et transmettez-le nous par email.</p>`;
  } else {
    statusHtml = `<h2>Récapitulatif prêt</h2><p>Le webhook n'est pas encore configuré. Copiez ce récapitulatif et transmettez-le à votre agence.</p>`;
  }
  form.innerHTML = `<section class="card success">
    <div class="icon">✓</div>
    ${statusHtml}
    <pre id="jsonOut" class="mono"></pre>
    <button type="button" class="add-btn" id="copyBtn" style="margin-top:12px;">Copier le récapitulatif</button>
  </section>`;
  document.getElementById('jsonOut').textContent = JSON.stringify(payload, null, 2);
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    document.getElementById('copyBtn').textContent = "Copié ✓";
  });
}

renderStep();
</script>
